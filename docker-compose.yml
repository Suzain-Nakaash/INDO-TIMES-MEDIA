# IndoTimesMedia — Docker Compose (Development)
# Usage: docker compose up -d

version: '3.8'

services:
  # ── Application ────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: indotimes-app
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://indotimes:indotimes_secret@postgres:5432/indotimesmedia?schema=public
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - indotimes-network

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: indotimes-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: indotimes
      POSTGRES_PASSWORD: indotimes_secret
      POSTGRES_DB: indotimesmedia
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U indotimes -d indotimesmedia']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - indotimes-network

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: indotimes-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - indotimes-network

  # ── MinIO (S3-Compatible Storage) ──────────────────────────
  minio:
    image: minio/minio:latest
    container_name: indotimes-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ':9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - indotimes-network

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  indotimes-network:
    driver: bridge
